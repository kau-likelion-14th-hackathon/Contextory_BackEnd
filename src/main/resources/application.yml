spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: contextory

  # Database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contextory}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# AWS
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      path:
        location: ${AWS_S3_PATH_LOCATION:static}

# Logging
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: ${JWT_EXPIRATION:3600000}
  refresh-exp-ms: ${JWT_REFRESH_EXPIRATION:1209600000}

# Github
github:
  app:
    slug: ${GITHUB_APP_SLUG}
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    callback-url: ${GITHUB_CALLBACK_URL:http://localhost:8080/api/github/callback}
    install-base-url: ${GITHUB_INSTALL_BASE_URL:https://github.com/apps}

  oauth:
    base-url: ${GITHUB_OAUTH_BASE_URL:https://github.com}
    state-expiration: ${GITHUB_OAUTH_STATE_EXPIRATION:10m}

  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    version: ${GITHUB_API_VERSION:2026-03-10}

  token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY}
