spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: contextory

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contextory}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/login/oauth2/code/kakao}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      path:
        location: ${AWS_S3_PATH_LOCATION:static}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: ${JWT_EXPIRATION:3600000}
  refresh-exp-ms: ${JWT_REFRESH_EXPIRATION:1209600000}

github:
  app:
    slug: ${GITHUB_APP_SLUG}
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    callback-url: ${GITHUB_CALLBACK_URL:https://api.contextory.kro.kr/api/github/callback}
    install-base-url: ${GITHUB_INSTALL_BASE_URL:https://github.com/apps}

  oauth:
    base-url: ${GITHUB_OAUTH_BASE_URL:https://github.com}
    state-expiration: ${GITHUB_OAUTH_STATE_EXPIRATION:10m}

  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    version: ${GITHUB_API_VERSION:2026-03-10}

  token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY}

contextory:
  server:
    base-url: ${SERVER_BASE_URL:http://localhost:8080}
  invitation:
    accept-url: ${INVITATION_ACCEPT_URL:http://localhost:3000/invitations/accept}
    mail-from: ${MAIL_FROM:${MAIL_USERNAME}}

ai:
  fastapi:
    base-url: ${FASTAPI_BASE_URL:http://localhost:8000}
    internal-api-key: ${INTERNAL_API_KEY}
